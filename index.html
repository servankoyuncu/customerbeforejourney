            "@type": "Question",

            "acceptedAnswer": {

            "@type": "Question",
            "name": "Ist mein Geld da nicht in Gefahr?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Anlagen schwanken, das gehört dazu. Deshalb bauen wir ein Portfolio, das zu deinem Risiko und deinen Zielen passt — von sicher bis renditestark. Du weisst vorher genau, worauf du dich einlässt."

            "@type": "Question",

              "@type": "Answer",

            }
          },
          {
            "@type": "Question",
            "name": "Kannst du mein Geld direkt verwalten?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ich berate und begleite dich beim Aufbau deiner Anlagen. Dein Geld bleibt jederzeit bei dir — du behältst die volle Kontrolle über dein Depot."
