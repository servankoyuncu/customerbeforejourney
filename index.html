<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>InsuFinance — Independent Financial Advice for Expats in Switzerland</title>
    <meta
      name="description"
      content="Health insurance, taxes, pillar 3a and pensions — explained for expats in Switzerland. Book a free 15-minute consultation with an independent financial planner."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="InsuFinance — Swiss finances, explained for expats" />
    <meta
      property="og:description"
      content="Independent financial planning for expats in Switzerland. Free 15-minute first consultation."
    />
    <meta property="og:image" content="https://insufinance.com/assets/david-frenkel.png" />
    <link rel="canonical" href="https://insufinance.com/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FinancialService",
        "name": "InsuFinance",
        "description": "Independent financial planning for expats in Switzerland: health insurance, taxes, pillar 3a/3b, vested benefits, investments, home financing.",
        "url": "https://insufinance.com/",
        "email": "david@frenkelconsulting.com",
        "telephone": "+41 76 501 51 02",
        "areaServed": { "@type": "Country", "name": "Switzerland" },
        "founder": { "@type": "Person", "name": "David Frenkel", "jobTitle": "Financial Planner (eidg. Fachausweis)" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What does the first consultation cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nothing. The first 15-minute conversation is free and without obligation. We'll map out where you stand and what — if anything — is worth doing next."
            }
          },
          {
            "@type": "Question",
            "name": "Are you really independent?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. We are not tied to any single insurer or bank and compare offers from 60+ partner companies, so recommendations are based on your situation, not on one provider's products."
            }
          },
          {
            "@type": "Question",
            "name": "Do you advise in English?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — consultations are available in English and German, and we explain Swiss-specific terms (KVG, pillar 3a, quellensteuer) in plain language."
            }
          },
          {
            "@type": "Question",
            "name": "Which cantons do you cover?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "All of Switzerland. Consultations take place by phone or video call, so your canton doesn't matter."
            }
          },
          {
            "@type": "Question",
            "name": "What should I prepare for the call?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nothing is required. If you have them handy, your current health insurance policy and any pension fund statements help us give more specific answers faster."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
